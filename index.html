<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งเป้าการผลิตประจำวัน</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 420px; }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #7f8c8d; font-size: 0.9em; margin-top: 0; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; font-size: 0.9em; }
    select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
    .row-flex { display: flex; gap: 10px; }
    .row-flex .flex-main { flex: 3; }
    .row-flex .flex-sub { flex: 1; }
    .btn-add { background: none; border: none; color: #27ae60; font-weight: bold; cursor: pointer; padding: 5px 0; display: inline-block; margin-bottom: 15px; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-submit { background-color: #2ec4b6; color: white; }
    .btn-cancel { background-color: #e74c3c; color: white; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>ตั้งเป้าการผลิตประจำวัน</h2>
  <p class="subtitle">Daily Production Target</p>

  <form id="tgForm">
    <div class="form-group">
      <label for="line">LINE</label>
      <select id="line" required onchange="loadLineData()">
        <option value="">-- เลือก LINE --</option>
        <option value="Line B">Line B</option>
        <option value="Line C">Line C</option>
        <option value="Line D">Line D</option>
        <option value="Line E">Line E</option>
        <option value="Line F">Line F</option>
        <option value="Line G">Line G</option>
      </select>
    </div>

    <!-- LOT 1 -->
    <div class="form-group">
      <div class="row-flex">
        <div class="flex-main">
          <label for="lotNumber">เลข LOT 1</label>
          <input type="text" id="lotNumber" placeholder="พิมพ์/สแกน" required>
        </div>
        <div class="flex-sub">
          <label for="workingHours">ชม.</label>
          <input type="number" id="workingHours" value="8" step="0.5" required>
        </div>
      </div>
    </div>

    <!-- LOT 2 -->
    <div id="lot2Container" class="form-group hidden">
      <div class="row-flex">
        <div class="flex-main">
          <label for="lotNumber2">เลข LOT 2</label>
          <input type="text" id="lotNumber2" placeholder="พิมพ์/สแกน">
        </div>
        <div class="flex-sub">
          <label for="workingHours2">ชม.</label>
          <input type="number" id="workingHours2" value="0" step="0.5">
        </div>
      </div>
    </div>

    <!-- LOT 3 -->
    <div id="lot3Container" class="form-group hidden">
      <div class="row-flex">
        <div class="flex-main">
          <label for="lotNumber3">เลข LOT 3</label>
          <input type="text" id="lotNumber3" placeholder="พิมพ์/สแกน">
        </div>
        <div class="flex-sub">
          <label for="workingHours3">ชม.</label>
          <input type="number" id="workingHours3" value="0" step="0.5">
        </div>
      </div>
    </div>

    <button type="button" class="btn-add" id="btnAddLot" onclick="addLotField()">+ เพิ่ม LOT</button>

    <div class="form-group">
      <label for="target">ยอดเป้าหมายประจำวัน (TG Target)</label>
      <input type="number" id="target" placeholder="กรอกเป้ารวม" required>
    </div>

    <div class="btn-group">
      <button type="button" class="btn btn-cancel" onclick="liff.closeWindow()">CANCEL</button>
      <button type="submit" class="btn btn-submit">SAVE</button>
    </div>
  </form>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec"; // เปลี่ยน URL ให้ตรงกับ Web App
  let currentLotCount = 1;
  let lineProfile = null;

  async function initLiff() {
    try {
      await liff.init({ liffId: "2011196323-6e8Sc2U8" });
      if (liff.isLoggedIn()) {
        lineProfile = await liff.getProfile();
      } else {
        liff.login();
      }
    } catch (err) {
      console.error("LIFF Init Error:", err);
    }
  }
  initLiff();

  function addLotField() {
    if (currentLotCount === 1) {
      document.getElementById('lot2Container').classList.remove('hidden');
      currentLotCount = 2;
    } else if (currentLotCount === 2) {
      document.getElementById('lot3Container').classList.remove('hidden');
      document.getElementById('btnAddLot').classList.add('hidden');
      currentLotCount = 3;
    }
  }

  async function loadLineData() {
    const line = document.getElementById('line').value;
    if (!line) return;

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`);
      const data = await res.json();

      if (data.reported) {
        document.getElementById('target').value = data.target || '';
        document.getElementById('lotNumber').value = data.lotNumber || '';
        document.getElementById('workingHours').value = data.workingHours || 8;

        if (data.lotNumber2) {
          document.getElementById('lot2Container').classList.remove('hidden');
          document.getElementById('lotNumber2').value = data.lotNumber2;
          document.getElementById('workingHours2').value = data.workingHours2 || 0;
          currentLotCount = 2;
        }

        if (data.lotNumber3) {
          document.getElementById('lot3Container').classList.remove('hidden');
          document.getElementById('lotNumber3').value = data.lotNumber3;
          document.getElementById('workingHours3').value = data.workingHours3 || 0;
          document.getElementById('btnAddLot').classList.add('hidden');
          currentLotCount = 3;
        }
      }
    } catch (err) {
      console.error("Error loading line data:", err);
    }
  }

  document.getElementById('tgForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      formType: "TG_FORM",
      line: document.getElementById('line').value,
      target: document.getElementById('target').value,
      lotNumber: document.getElementById('lotNumber').value,
      workingHours: document.getElementById('workingHours').value || 0,
      lotNumber2: document.getElementById('lotNumber2').value || "",
      workingHours2: document.getElementById('workingHours2').value || 0,
      lotNumber3: document.getElementById('lotNumber3').value || "",
      workingHours3: document.getElementById('workingHours3').value || 0,
      updatedBy: lineProfile ? lineProfile.displayName : "Unknown"
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.status === 'success') {
        alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
        liff.closeWindow();
      } else {
        alert("เกิดข้อผิดพลาด: " + (result.error || "ไม่สามารถบันทึกได้"));
      }
    } catch (err) {
      alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
      console.error(err);
    }
  });
</script>

</body>
</html>
