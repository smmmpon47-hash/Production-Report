<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งเป้าการผลิตประจำวัน</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8FAFC; color: #0F172A; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-center">

  <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-xl space-y-4">
    <div class="text-center pb-2 border-b border-slate-100">
      <h1 class="text-xl font-bold text-slate-800 tracking-wide">📝 ตั้งเป้าการผลิตประจำวัน</h1>
      <p class="text-xs text-slate-400 mt-1">กรอกข้อมูลเป้าหมายประจำไลน์การผลิต</p>
    </div>

    <div id="alertBanner" class="hidden p-3 rounded-xl text-xs bg-amber-50 border border-amber-200 text-amber-700 font-medium"></div>

    <form id="reportForm" onsubmit="handleSubmit(event)" class="space-y-3.5">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">LINE การผลิต <span class="text-rose-500">*</span></label>
        <div class="relative">
          <select id="lineCode" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 appearance-none focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all outline-none text-sm" onchange="fetchLineData()" required>
            <option value="" disabled selected>-- เลือก LINE --</option>
            <option value="B">LINE B</option>
            <option value="C">LINE C</option>
            <option value="D">LINE D</option>
            <option value="E">LINE E</option>
            <option value="F">LINE F</option>
            <option value="G">LINE G</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 text-xs">▼</div>
        </div>
      </div>

      <!-- LOT 1 -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-semibold text-slate-600">เลข LOT 1 <span class="text-rose-500">*</span></label>
          <button type="button" onclick="toggleLot2()" id="btnToggleLot2" class="text-xs font-semibold text-emerald-600 hover:text-emerald-700">+ เพิ่ม LOT 2</button>
        </div>
        <div class="flex gap-2">
          <input type="text" id="lotNumber" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-medium text-slate-800 uppercase focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all outline-none text-sm" placeholder="พิมพ์ หรือ สแกน LOT 1" onblur="fetchLotInfo('1')" required>
          <button type="button" onclick="scanBarcode('lotNumber')" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-600 px-4 rounded-xl flex items-center justify-center transition-all active:scale-95">📷</button>
        </div>
      </div>

      <div id="lotInfoBox1" class="hidden p-3 bg-slate-50 border border-emerald-200 rounded-2xl space-y-1.5 text-xs">
        <div class="flex justify-between items-center border-b border-slate-200 pb-1">
          <span class="text-slate-500">รุ่น (Model LOT 1)</span>
          <span id="infoModel1" class="font-bold text-slate-800 text-xs">-</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-slate-500">เป้า PO</span>
          <span id="infoPoTarget1" class="font-semibold text-emerald-600">-</span>
        </div>
      </div>

      <!-- Section LOT 2 (ซ่อนเป็น Default) -->
      <div id="lot2Section" class="hidden p-3 bg-amber-50/50 border border-amber-200 rounded-2xl space-y-3 mt-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-amber-800">📦 ข้อมูล LOT 2 (เพิ่มเติม)</span>
          <button type="button" onclick="toggleLot2()" class="text-xs text-rose-500 hover:underline">ยกเลิก</button>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">เลข LOT 2</label>
          <div class="flex gap-2">
            <input type="text" id="lotNumber2" class="w-full p-3 bg-white border border-slate-200 rounded-xl font-medium text-slate-800 uppercase focus:border-emerald-500 transition-all outline-none text-sm" placeholder="พิมพ์ หรือ สแกน LOT 2" onblur="fetchLotInfo('2')">
            <button type="button" onclick="scanBarcode('lotNumber2')" class="bg-amber-100 border border-amber-200 text-amber-700 px-4 rounded-xl flex items-center justify-center">📷</button>
          </div>
        </div>

        <div id="lotInfoBox2" class="hidden p-2.5 bg-white border border-amber-200 rounded-xl space-y-1 text-xs">
          <div class="flex justify-between items-center">
            <span class="text-slate-500">รุ่น (Model LOT 2)</span>
            <span id="infoModel2" class="font-bold text-slate-800 text-xs">-</span>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">เวลาผลิต LOT 2 (ชม.)</label>
          <input type="number" id="workingHours2" step="0.5" min="0" max="24" class="w-full p-2.5 bg-white border border-slate-200 rounded-xl font-bold text-slate-700 text-center text-sm" value="0">
        </div>
      </div>

      <div class="grid grid-cols-5 gap-2">
        <div class="col-span-3">
          <label class="block text-xs font-semibold text-slate-600 mb-1">TG (เป้ารวมประจำวัน) <span class="text-rose-500">*</span></label>
          <input type="number" id="target" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-xl text-emerald-600 focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all outline-none text-sm" placeholder="เป้ารวม" required>
        </div>
        <div class="col-span-2">
          <label class="block text-xs font-semibold text-slate-600 mb-1">เวลา LOT 1 (ชม.) <span class="text-rose-500">*</span></label>
          <input type="number" id="workingHours" step="0.5" min="1" max="24" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-xl text-slate-700 text-center focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all outline-none text-sm" value="8" required>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">วันที่ (อัตโนมัติ)</label>
        <input type="text" id="reportDate" class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl text-xs font-medium text-slate-400 cursor-not-allowed" readonly>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <button type="button" onclick="liff.closeWindow()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl transition-all active:scale-95 text-sm">CANCEL</button>
        <button type="submit" id="btnSave" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-xl shadow-lg shadow-emerald-500/25 transition-all active:scale-95 text-sm">SAVE</button>
      </div>
    </form>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec"; 
    const LIFF_ID = "2011196323-6e8Sc2U8";                 
    let hasLot2 = false;

    document.addEventListener("DOMContentLoaded", async () => {
      document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
      try { await liff.init({ liffId: LIFF_ID }); } catch (err) { console.error("LIFF Init Error", err); }
    });

    function toggleLot2() {
      hasLot2 = !hasLot2;
      const section = document.getElementById('lot2Section');
      const btn = document.getElementById('btnToggleLot2');
      if (hasLot2) {
        section.classList.remove('hidden');
        btn.innerText = "- ซ่อน LOT 2";
      } else {
        section.classList.add('hidden');
        btn.innerText = "+ เพิ่ม LOT 2";
        document.getElementById('lotNumber2').value = '';
        document.getElementById('workingHours2').value = '0';
        document.getElementById('lotInfoBox2').classList.add('hidden');
      }
    }

    async function scanBarcode(targetId) {
      if (!liff.isInClient()) {
        alert("กรุณาเปิดบนแอป LINE เพื่อใช้งานระบบสแกน");
        return;
      }
      try {
        const result = await liff.scanCodeV2();
        if (result.value) {
          document.getElementById(targetId).value = result.value.toUpperCase();
          fetchLotInfo(targetId === 'lotNumber' ? '1' : '2');
        }
      } catch (err) { alert("สแกนไม่สำเร็จ: " + err.message); }
    }

    async function fetchLineData() {
      const line = document.getElementById('lineCode').value;
      if (!line) return;

      const res = await fetch(`${GAS_WEB_APP_URL}?action=getTodayLine&line=${line}`);
      const data = await res.json();

      const alertBanner = document.getElementById('alertBanner');
      if (data.reported) {
        alertBanner.classList.remove('hidden');
        alertBanner.innerText = `⚠️ LINE ${line} เคยลงเป้าไว้แล้ว (${data.target}) อัปเดตล่าสุด ${data.lastUpdate}`;
        document.getElementById('btnSave').innerText = "UPDATE";
      } else {
        alertBanner.classList.add('hidden');
        document.getElementById('btnSave').innerText = "SAVE";
      }

      if (data.target) document.getElementById('target').value = data.target;
      if (data.otHours) document.getElementById('workingHours').value = data.otHours;
      if (data.lotNumber) {
        document.getElementById('lotNumber').value = data.lotNumber;
        fetchLotInfo('1');
      }
      if (data.lotNumber2) {
        if (!hasLot2) toggleLot2();
        document.getElementById('lotNumber2').value = data.lotNumber2;
        document.getElementById('workingHours2').value = data.workingHours2 || 0;
        fetchLotInfo('2');
      }
    }

    async function fetchLotInfo(type) {
      const fieldId = type === '1' ? 'lotNumber' : 'lotNumber2';
      const lot = document.getElementById(fieldId).value.trim();
      if (!lot) return;

      const res = await fetch(`${GAS_WEB_APP_URL}?searchLot=${lot}`);
      const data = await res.json();

      const box = document.getElementById(type === '1' ? 'lotInfoBox1' : 'lotInfoBox2');
      if (data.error) {
        box.classList.add('hidden');
      } else {
        box.classList.remove('hidden');
        if (type === '1') {
          document.getElementById('infoModel1').innerText = data.model;
          document.getElementById('infoPoTarget1').innerText = Number(data.po_target).toLocaleString();
        } else {
          document.getElementById('infoModel2').innerText = data.model;
        }
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerText = "บันทึก...";

      let profileName = "Unknown";
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        profileName = profile.displayName;
      }

      const payload = {
        line: document.getElementById('lineCode').value,
        lotNumber: document.getElementById('lotNumber').value,
        target: Number(document.getElementById('target').value),
        workingHours: Number(document.getElementById('workingHours').value),
        lotNumber2: hasLot2 ? document.getElementById('lotNumber2').value : '',
        workingHours2: hasLot2 ? Number(document.getElementById('workingHours2').value) : 0,
        updatedBy: profileName
      };

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.error) {
          alert("เกิดข้อผิดพลาด: " + result.error);
          btn.disabled = false;
          btn.innerText = "SAVE";
          return;
        }
        alert("ตั้งเป้าหมายสำเร็จ!");
        liff.closeWindow();
      } catch (err) {
        alert("ส่งไม่สำเร็จ กรุณาลองใหม่: " + err.message);
        btn.disabled = false;
        btn.innerText = "SAVE";
      }
    }
  </script>
</body>
</html>
