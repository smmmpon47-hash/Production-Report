<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เป้าผลิตประจำวัน</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #f5f5f5; padding: 15px; margin: 0; }
    .card { background: #fff; padding: 20px; border-radius: 8px; border: 2px solid #333; max-width: 400px; margin: 0 auto; }
    h2 { text-align: center; margin-top: 0; font-size: 1.5rem; color: #111; }
    
    .field-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 1.1rem; }
    
    select, input { padding: 8px; font-size: 1rem; border: 1px solid #333; border-radius: 4px; }
    select { width: 100%; }

    /* จัดโครงสร้างเลข LOT + ปุ่มสแกน + ชม. */
    .lot-row { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
    .input-lot { flex: 1; }
    .btn-qr { padding: 8px 10px; background: #eee; border: 1px solid #333; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .input-hrs { width: 60px; text-align: center; }

    .btn-add { background: none; border: none; color: #0066cc; font-size: 1rem; cursor: pointer; padding: 5px 0; font-weight: bold; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 25px; }
    .btn { flex: 1; padding: 12px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; border: 2px solid #333; }
    .btn-cancel { background: #fff; color: #333; }
    .btn-save { background: #28a745; color: #fff; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>เป้าผลิตประจำวัน</h2>

  <form id="tgForm">
    <div class="field-group">
      <label for="line">LINE</label>
      <select id="line" required onchange="loadLineData()">
        <option value="">-- เลือก --</option>
        <option value="Line B">Line B</option>
        <option value="Line C">Line C</option>
        <option value="Line D">Line D</option>
        <option value="Line E">Line E</option>
        <option value="Line F">Line F</option>
        <option value="Line G">Line G</option>
      </select>
    </div>

    <!-- LOT 1 -->
    <div class="field-group">
      <div style="display: flex; justify-content: space-between;">
        <label>เลข LOT</label>
        <label style="width: 60px; text-align: center;">ชม.</label>
      </div>
      <div class="lot-row">
        <input type="text" id="lotNumber" class="input-lot" placeholder="เลข LOT 1" required>
        <button type="button" class="btn-qr" onclick="scanQR('lotNumber')">📷</button>
        <input type="number" id="workingHours" class="input-hrs" value="8" step="0.5" required>
      </div>
    </div>

    <!-- LOT 2 -->
    <div id="lot2Container" class="field-group hidden">
      <div class="lot-row">
        <input type="text" id="lotNumber2" class="input-lot" placeholder="เลข LOT 2">
        <button type="button" class="btn-qr" onclick="scanQR('lotNumber2')">📷</button>
        <input type="number" id="workingHours2" class="input-hrs" value="0" step="0.5">
      </div>
    </div>

    <!-- LOT 3 -->
    <div id="lot3Container" class="field-group hidden">
      <div class="lot-row">
        <input type="text" id="lotNumber3" class="input-lot" placeholder="เลข LOT 3">
        <button type="button" class="btn-qr" onclick="scanQR('lotNumber3')">📷</button>
        <input type="number" id="workingHours3" class="input-hrs" value="0" step="0.5">
      </div>
    </div>

    <button type="button" class="btn-add" id="btnAddLot" onclick="addLotField()">+ เพิ่ม LOT (ถ้ามี)</button>

    <div class="field-group" style="margin-top: 15px;">
      <label for="target">TG</label>
      <input type="number" id="target" style="width: 100%;" placeholder="เป้ารวม" required>
    </div>

    <div class="btn-group">
      <button type="button" class="btn btn-cancel" onclick="liff.closeWindow()">CANCEL</button>
      <button type="submit" class="btn btn-save">SAVE</button>
    </div>
  </form>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec";
  let currentLotCount = 1;
  let lineProfile = null;

  async function initLiff() {
    try {
      await liff.init({ liffId: "2011196323-6e8Sc2U8" });
      if (liff.isLoggedIn()) { lineProfile = await liff.getProfile(); }
      else { liff.login(); }
    } catch (err) { console.error(err); }
  }
  initLiff();

  function scanQR(targetInputId) {
    if (!liff.isInClient()) {
      alert("การสแกน QR Code รองรับการเปิดผ่านแอป LINE เท่านั้น");
      return;
    }
    liff.scanCodeV2().then(result => {
      if (result.value) {
        document.getElementById(targetInputId).value = result.value;
      }
    }).catch(err => console.error(err));
  }

  function addLotField() {
    if (currentLotCount === 1) {
      document.getElementById('lot2Container').classList.remove('hidden');
      currentLotCount = 2;
    } else if (currentLotCount === 2) {
      document.getElementById('lot3Container').classList.remove('hidden');
      document.getElementById('btnAddLot').classList.add('hidden');
      currentLotCount = 3;
    }
  }

  async function loadLineData() {
    const line = document.getElementById('line').value;
    if (!line) return;

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`);
      const data = await res.json();

      if (data.reported) {
        document.getElementById('target').value = data.target || '';
        document.getElementById('lotNumber').value = data.lotNumber || '';
        document.getElementById('workingHours').value = data.workingHours || 8;

        if (data.lotNumber2) {
          document.getElementById('lot2Container').classList.remove('hidden');
          document.getElementById('lotNumber2').value = data.lotNumber2;
          document.getElementById('workingHours2').value = data.workingHours2 || 0;
          currentLotCount = 2;
        }

        if (data.lotNumber3) {
          document.getElementById('lot3Container').classList.remove('hidden');
          document.getElementById('lotNumber3').value = data.lotNumber3;
          document.getElementById('workingHours3').value = data.workingHours3 || 0;
          document.getElementById('btnAddLot').classList.add('hidden');
          currentLotCount = 3;
        }
      }
    } catch (err) { console.error(err); }
  }

  document.getElementById('tgForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      formType: "TG_FORM",
      line: document.getElementById('line').value,
      target: document.getElementById('target').value,
      lotNumber: document.getElementById('lotNumber').value,
      workingHours: document.getElementById('workingHours').value || 0,
      lotNumber2: document.getElementById('lotNumber2').value || "",
      workingHours2: document.getElementById('workingHours2').value || 0,
      lotNumber3: document.getElementById('lotNumber3').value || "",
      workingHours3: document.getElementById('workingHours3').value || 0,
      updatedBy: lineProfile ? lineProfile.displayName : "Unknown"
    };

    try {
      const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
      const result = await res.json();
      if (result.status === 'success') { alert("บันทึกเรียบร้อย!"); liff.closeWindow(); }
      else { alert("ข้อผิดพลาด: " + result.error); }
    } catch (err) { alert("ส่งข้อมูลไม่สำเร็จ"); }
  });
</script>

</body>
</html>
