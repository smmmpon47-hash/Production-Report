<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งเป้าการผลิตประจำวัน (Form TG)</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body {
      background-color: #1e3a3f;
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .card {
      background: #ffffff;
      padding: 24px 22px;
      border-radius: 24px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0d9488;
      margin: 0 0 18px 0;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #1e293b; font-size: 0.95rem; }
    
    select, input {
      width: 100%;
      padding: 11px 14px;
      border: 1.8px solid #cbd5e1;
      border-radius: 14px;
      font-size: 1.05rem;
      outline: none;
      background: #fff;
      color: #0f172a;
    }
    select:focus, input:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3.5px rgba(13, 148, 136, 0.2);
    }

    .lot-card {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .lot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .badge-rate {
      font-size: 0.85rem;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 10px;
      font-weight: 600;
    }

    .row-2col {
      display: flex;
      gap: 12px;
    }
    .row-2col .form-group { flex: 1; margin-bottom: 8px; }

    .model-subtext {
      font-size: 0.8rem;
      color: #0d9488;
      font-weight: 600;
      margin-top: 4px;
      min-height: 18px;
    }

    /* ปุ่มกดเลือก เวลาทำงาน */
    .hours-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .btn-hour-chip {
      flex: 1;
      padding: 12px 0;
      background: #fff;
      border: 1.8px solid #cbd5e1;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .btn-hour-chip.active {
      background: #0d9488;
      color: #ffffff;
      border-color: #0d9488;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
    }

    .summary-box {
      background: #0d9488;
      color: white;
      border-radius: 18px;
      padding: 14px 18px;
      margin: 18px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-title { font-size: 0.9rem; opacity: 0.95; font-weight: 500; }
    .summary-subtitle { font-size: 0.75rem; opacity: 0.8; }
    .summary-value { font-size: 1.5rem; font-weight: 700; }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
      margin-top: 6px;
    }
    .btn-submit:disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="card">
  <h2 class="header-title">🎯 ตั้งเป้าการผลิตประจำวัน</h2>

  <form id="tgForm">
    <!-- เลือกลายการผลิต B - G -->
    <div class="form-group">
      <label for="lineSelect">LINE การผลิต</label>
      <select id="lineSelect" required onchange="onLineSelected()">
        <option value="">-- เลือก LINE --</option>
        <option value="Line B">Line B</option>
        <option value="Line C">Line C</option>
        <option value="Line D">Line D</option>
        <option value="Line E">Line E</option>
        <option value="Line F">Line F</option>
        <option value="Line G">Line G</option>
      </select>
    </div>

    <!-- LOT 1 Card -->
    <div class="lot-card" id="cardLot1">
      <div class="lot-header">
        <span>📦 LOT ที่ 1</span>
        <span class="badge-rate" id="rateLot1Display">Rate: 0 ชิ้น/ชม.</span>
      </div>
      
      <div class="form-group">
        <label for="lot1No">เลข LOT Number</label>
        <input type="text" id="lot1No" placeholder="กรอกเลข LOT" required oninput="onLotInput(1)">
        <div class="model-subtext" id="modelSubtext1"></div>
      </div>

      <div class="row-2col">
        <div class="form-group" id="lot1HoursContainer" style="display: none;">
          <label for="lot1HoursSelect">ชั่วโมงผลิตจริง</label>
          <select id="lot1HoursSelect" onchange="onLot1HoursChange()">
            <!-- JS จะสเกลตัวเลือกตามเวลารวม -->
          </select>
        </div>
        <div class="form-group">
          <label for="lot1Target">เป้าหมาย (ชิ้น)</label>
          <input type="number" id="lot1Target" min="0" placeholder="0" required oninput="calculateRate()">
        </div>
      </div>
    </div>

    <!-- ปุ่มเลือก เวลาทำงานรวม -->
    <div class="form-group">
      <label>เวลาทำงานรวม</label>
      <div class="hours-btn-group">
        <button type="button" class="btn-hour-chip" onclick="selectTotalHours(8)">8 ชม.</button>
        <button type="button" class="btn-hour-chip active" onclick="selectTotalHours(9)">9 ชม.</button>
        <button type="button" class="btn-hour-chip" onclick="selectTotalHours(10)">10 ชม.</button>
      </div>
      <input type="hidden" id="selectedTotalHours" value="9">
    </div>

    <!-- สรุปเป้ารวม -->
    <div class="summary-box">
      <div>
        <div class="summary-title">เป้าหมายรวมทั้งวัน</div>
        <div class="summary-subtitle">(คำนวณตามสัดส่วนชั่วโมงจริง)</div>
      </div>
      <div class="summary-value"><span id="totalTargetDisplay">0</span> ชิ้น</div>
    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">บันทึกเป้าหมาย</button>
  </form>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLm1LVkTiwK3PCvPSt3PFA1ifb76KCRsWxC1SkaLdDC-ginxy0RHWstWpHgDytaBmm/exec";
  const LIFF_ID = "2011196323-6e8Sc2U8";

  let masterLotMap = {};
  let userDisplayName = "Unknown";
  let initialTarget1 = 0;

  async function initLiff() {
    try {
      if (typeof liff !== "undefined" && LIFF_ID) {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userDisplayName = profile.displayName;
        }
      }
    } catch (err) {
      console.error("LIFF Init Error:", err);
    }
  }

  initLiff();

  function selectTotalHours(hrs) {
    document.getElementById('selectedTotalHours').value = hrs;
    const buttons = document.querySelectorAll('.btn-hour-chip');
    buttons.forEach(btn => {
      if (btn.innerText.includes(hrs)) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
    updateLot1HoursDropdown(hrs);
    calculateRate();
  }

  function updateLot1HoursDropdown(totalHrs) {
    const select = document.getElementById('lot1HoursSelect');
    select.innerHTML = `<option value="${totalHrs}">${totalHrs} ชม. (เต็มวัน)</option>`;
    for (let i = 1; i < totalHrs; i++) {
      select.innerHTML += `<option value="${i}">${i} ชม.</option>`;
    }
  }

  async function onLineSelected() {
    const line = document.getElementById('lineSelect').value;
    if (!line) return;

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`);
      const data = await res.json();
      masterLotMap = data.masterMap || {};

      if (data.lotNumber) {
        document.getElementById('lot1No').value = data.lotNumber;
        document.getElementById('lot1Target').value = data.target1 || data.target || 0;
        initialTarget1 = Number(data.target1 || data.target) || 0;
        
        if (data.totalWorkingHours) {
          selectTotalHours(Number(data.totalWorkingHours));
        }
        onLotInput(1);
      }
    } catch (err) {
      console.error("Error loading line data:", err);
    }
  }

  function onLotInput(index) {
    const lotVal = document.getElementById(`lot${index}No`).value.trim().toUpperCase();
    const subtextElem = document.getElementById(`modelSubtext${index}`);
    if (lotVal && masterLotMap[lotVal]) {
      subtextElem.innerText = `(รุ่น: ${masterLotMap[lotVal]})`;
    } else {
      subtextElem.innerText = '';
    }
  }

  function calculateRate() {
    const totalHrs = Number(document.getElementById('selectedTotalHours').value) || 9;
    const t1 = Number(document.getElementById('lot1Target').value) || 0;
    
    const rate1 = totalHrs > 0 ? Math.round(t1 / totalHrs) : 0;
    document.getElementById('rateLot1Display').innerText = `Rate: ${rate1} ชิ้น/ชม.`;
    document.getElementById('totalTargetDisplay').innerText = t1.toLocaleString();
  }

  // เรียกใช้เริ่มต้นสำหรับ 9 ชม.
  updateLot1HoursDropdown(9);

  document.getElementById('tgForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const lineVal = document.getElementById('lineSelect').value;
    const lot1No = document.getElementById('lot1No').value.trim().toUpperCase();
    const lot1Target = Number(document.getElementById('lot1Target').value) || 0;
    const totalHrs = Number(document.getElementById('selectedTotalHours').value) || 9;
    const btnSubmit = document.getElementById('btnSubmit');

    if (!lineVal || !lot1No) {
      alert("กรุณากรอกข้อมูลให้ครบถ้วน");
      return;
    }

    btnSubmit.disabled = true;
    btnSubmit.innerText = "กำลังบันทึก...";

    const payload = {
      action: "TG_FORM",
      line: lineVal,
      lotNumber: lot1No,
      target: lot1Target,
      workingHours: totalHrs,
      updatedBy: userDisplayName
    };

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await res.json();

      if (result.status === "success") {
        alert("บันทึกเป้าหมายการผลิตเรียบร้อยแล้ว!");
        if (typeof liff !== "undefined" && liff.isInClient()) {
          liff.closeWindow();
        }
      } else {
        alert("เกิดข้อผิดพลาด: " + (result.error || "ไม่สามารถบันทึกได้"));
      }
    } catch (err) {
      alert("บันทึกไม่สำเร็จ: " + err.message);
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.innerText = "บันทึกเป้าหมาย";
    }
  });
</script>

</body>
</html>
