<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เป้ายอดการผลิต</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      padding: 26px 20px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .header-box { text-align: center; margin-bottom: 20px; }
    .header-box h2 {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 700;
      background: linear-gradient(45deg, #06c755, #00b0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #2c3e50; font-size: 0.95rem; }
    
    select, input {
      width: 100%;
      padding: 11px 13px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      background: #f8fafc;
      color: #1e293b;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #06c755;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(6, 199, 85, 0.15);
    }

    .lot-row { display: flex; gap: 8px; align-items: center; }
    .input-lot { flex: 1; }
    .btn-scan {
      background: #e2e8f0;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-scan:active { background: #cbd5e1; transform: scale(0.95); }

    .btn-add {
      background: #e8f5e9;
      border: 1.5px dashed #06c755;
      color: #06c755;
      font-weight: 600;
      cursor: pointer;
      padding: 10px;
      border-radius: 12px;
      width: 100%;
      font-size: 0.9rem;
      margin-top: 5px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .btn-add:active { transform: scale(0.98); background: #d4edda; }

    /* ปุ่มกดเลือกเวลาทำงาน (8 ชม. / 9 ชม. / 10 ชม.) */
    .hours-btn-group {
      display: flex;
      gap: 10px;
    }
    .btn-hour {
      flex: 1;
      padding: 11px 0;
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font-weight: 600;
      color: #475569;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-hour.active {
      background: #06c755;
      border-color: #06c755;
      color: white;
      box-shadow: 0 4px 10px rgba(6, 199, 85, 0.3);
    }

    .btn-group { display: flex; gap: 12px; margin-top: 24px; }
    .btn {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .btn-submit {
      background: linear-gradient(135deg, #06c755, #00a843);
      color: white;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
    }
    .btn-submit:active { transform: scale(0.97); }
    .btn-cancel { background: #f1f5f9; color: #64748b; }
    .btn-cancel:active { background: #e2e8f0; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="header-box">
    <h2>เป้ายอดการผลิต</h2>
  </div>

  <form id="tgForm">
    <!-- 1. LINE การผลิต -->
    <div class="form-group">
      <label for="line">LINE การผลิต</label>
      <select id="line" required onchange="loadLineData()">
        <option value="">-- เลือก LINE --</option>
        <option value="Line B">Line B</option>
        <option value="Line C">Line C</option>
        <option value="Line D">Line D</option>
        <option value="Line E">Line E</option>
        <option value="Line F">Line F</option>
        <option value="Line G">Line G</option>
      </select>
    </div>

    <!-- 2. กรอก LOT 1 -->
    <div class="form-group">
      <label>กรอก LOT 1</label>
      <div class="lot-row">
        <input type="text" id="lotNumber" class="input-lot" placeholder="พิมพ์/สแกน LOT 1" required>
        <button type="button" class="btn-scan" onclick="scanQR('lotNumber')" title="สแกน Barcode/QR">📷</button>
      </div>
    </div>

    <!-- LOT 2 (ซ่อนไว้ รอเพิ่ม) -->
    <div id="lot2Container" class="form-group hidden">
      <label>กรอก LOT 2</label>
      <div class="lot-row">
        <input type="text" id="lotNumber2" class="input-lot" placeholder="พิมพ์/สแกน LOT 2">
        <button type="button" class="btn-scan" onclick="scanQR('lotNumber2')" title="สแกน Barcode/QR">📷</button>
      </div>
    </div>

    <!-- LOT 3 (ซ่อนไว้ รอเพิ่ม) -->
    <div id="lot3Container" class="form-group hidden">
      <label>กรอก LOT 3</label>
      <div class="lot-row">
        <input type="text" id="lotNumber3" class="input-lot" placeholder="พิมพ์/สแกน LOT 3">
        <button type="button" class="btn-scan" onclick="scanQR('lotNumber3')" title="สแกน Barcode/QR">📷</button>
      </div>
    </div>

    <!-- 3. เป้า -->
    <div class="form-group">
      <label for="target">เป้า</label>
      <input type="number" id="target" placeholder="กรอกเป้าหมายยอดผลิต" required min="1">
    </div>

    <!-- 4. ปุ่ม + เพิ่ม LOT -->
    <button type="button" class="btn-add" id="btnAddLot" onclick="addLotField()">+ เพิ่ม LOT</button>

    <!-- 5. เวลาการทำงาน -->
    <div class="form-group">
      <label>เวลาการทำงาน</label>
      <div class="hours-btn-group">
        <button type="button" class="btn-hour active" onclick="selectHour(8, this)">8 ชม.</button>
        <button type="button" class="btn-hour" onclick="selectHour(9, this)">9 ชม.</button>
        <button type="button" class="btn-hour" onclick="selectHour(10, this)">10 ชม.</button>
      </div>
    </div>

    <!-- 6. CANCEL / SAVE -->
    <div class="btn-group">
      <button type="button" class="btn btn-cancel" onclick="liff.closeWindow()">CANCEL</button>
      <button type="submit" class="btn btn-submit">SAVE</button>
    </div>
  </form>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwziSYLaDcymEHVXQr_qOP6RmIQDjixVPqWwhAQSOMXs_4zAA-gscpeuR7fJp7DY6yp/exec";
  let currentLotCount = 1;
  let selectedHours = 8;
  let lineProfile = null;

  async function initLiff() {
    try {
      await liff.init({ liffId: "2011196323-6e8Sc2U8" });
      if (liff.isLoggedIn()) { lineProfile = await liff.getProfile(); }
      else { liff.login(); }
    } catch (err) { console.error("LIFF Init Error:", err); }
  }
  initLiff();

  function scanQR(targetInputId) {
    if (!liff.isInClient()) {
      alert("การสแกนรองรับเฉพาะการเปิดผ่านแอป LINE บนมือถือเท่านั้น");
      return;
    }
    liff.scanCodeV2().then(result => {
      if (result.value) { document.getElementById(targetInputId).value = result.value; }
    }).catch(err => console.error("Scan Error:", err));
  }

  function selectHour(hrs, btnElement) {
    selectedHours = hrs;
    const buttons = document.querySelectorAll('.btn-hour');
    buttons.forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
  }

  function addLotField() {
    if (currentLotCount === 1) {
      document.getElementById('lot2Container').classList.remove('hidden');
      currentLotCount = 2;
    } else if (currentLotCount === 2) {
      document.getElementById('lot3Container').classList.remove('hidden');
      document.getElementById('btnAddLot').classList.add('hidden');
      currentLotCount = 3;
    }
  }

  async function loadLineData() {
    const line = document.getElementById('line').value;
    if (!line) return;

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`);
      const data = await res.json();

      if (data.reported) {
        document.getElementById('target').value = data.target || '';
        document.getElementById('lotNumber').value = data.lotNumber || '';
        
        const hrs = Number(data.totalWorkingHours) || 8;
        const btnIndex = hrs === 9 ? 1 : (hrs === 10 ? 2 : 0);
        const hourButtons = document.querySelectorAll('.btn-hour');
        if (hourButtons[btnIndex]) selectHour(hrs, hourButtons[btnIndex]);

        if (data.lotNumber2) {
          document.getElementById('lot2Container').classList.remove('hidden');
          document.getElementById('lotNumber2').value = data.lotNumber2;
          currentLotCount = 2;
        }

        if (data.lotNumber3) {
          document.getElementById('lot3Container').classList.remove('hidden');
          document.getElementById('lotNumber3').value = data.lotNumber3;
          document.getElementById('btnAddLot').classList.add('hidden');
          currentLotCount = 3;
        }
      }
    } catch (err) { console.error("Error loading line data:", err); }
  }

  document.getElementById('tgForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      formType: "TG_FORM",
      line: document.getElementById('line').value,
      target: document.getElementById('target').value,
      lotNumber: document.getElementById('lotNumber').value,
      workingHours: selectedHours,
      lotNumber2: document.getElementById('lotNumber2').value || "",
      workingHours2: 0,
      lotNumber3: document.getElementById('lotNumber3').value || "",
      workingHours3: 0,
      updatedBy: lineProfile ? lineProfile.displayName : "Unknown"
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.status === 'success') {
        alert("บันทึกเป้าหมายประจำวันเรียบร้อยแล้ว!");
        liff.closeWindow();
      } else {
        alert("เกิดข้อผิดพลาด: " + (result.error || "ไม่สามารถบันทึกได้"));
      }
    } catch (err) {
      alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
      console.error(err);
    }
  });
</script>

</body>
</html>
