<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งเป้าการผลิตประจำวัน</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .header-box { text-align: center; margin-bottom: 22px; }
    .header-box h2 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(45deg, #06c755, #00b0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-box p { color: #666; font-size: 0.82rem; margin-top: 4px; font-weight: 400; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #2c3e50; font-size: 0.88rem; }
    
    select, input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      background: #f8fafc;
      color: #1e293b;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #06c755;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(6, 199, 85, 0.15);
    }

    .row-flex { display: flex; gap: 10px; }
    .row-flex .flex-main { flex: 3; }
    .row-flex .flex-sub { flex: 1.2; }

    .lot-card {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      margin-bottom: 12px;
    }

    .btn-add {
      background: #e8f5e9;
      border: 1.5px dashed #06c755;
      color: #06c755;
      font-weight: 600;
      cursor: pointer;
      padding: 10px;
      border-radius: 12px;
      width: 100%;
      font-size: 0.88rem;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .btn-add:active { transform: scale(0.98); background: #d4edda; }

    .btn-group { display: flex; gap: 12px; margin-top: 24px; }
    .btn {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .btn-submit {
      background: linear-gradient(135deg, #06c755, #00a843);
      color: white;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
    }
    .btn-submit:active { transform: scale(0.97); }
    .btn-cancel { background: #f1f5f9; color: #64748b; }
    .btn-cancel:active { background: #e2e8f0; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="header-box">
    <h2>ตั้งเป้าการผลิตประจำวัน</h2>
    <p>Daily Production Target Settings</p>
  </div>

  <form id="tgForm">
    <div class="form-group">
      <label for="line">LINE การผลิต</label>
      <select id="line" required onchange="loadLineData()">
        <option value="">-- เลือก LINE --</option>
        <option value="Line B">Line B</option>
        <option value="Line C">Line C</option>
        <option value="Line D">Line D</option>
        <option value="Line E">Line E</option>
        <option value="Line F">Line F</option>
        <option value="Line G">Line G</option>
      </select>
    </div>

    <!-- LOT 1 -->
    <div class="lot-card">
      <div class="row-flex">
        <div class="flex-main">
          <label for="lotNumber">เลข LOT 1</label>
          <input type="text" id="lotNumber" placeholder="พิมพ์/สแกน" required>
        </div>
        <div class="flex-sub">
          <label for="workingHours">ชม.</label>
          <input type="number" id="workingHours" value="8" step="0.5" required>
        </div>
      </div>
    </div>

    <!-- LOT 2 -->
    <div id="lot2Container" class="lot-card hidden">
      <div class="row-flex">
        <div class="flex-main">
          <label for="lotNumber2">เลข LOT 2</label>
          <input type="text" id="lotNumber2" placeholder="พิมพ์/สแกน">
        </div>
        <div class="flex-sub">
          <label for="workingHours2">ชม.</label>
          <input type="number" id="workingHours2" value="0" step="0.5">
        </div>
      </div>
    </div>

    <!-- LOT 3 -->
    <div id="lot3Container" class="lot-card hidden">
      <div class="row-flex">
        <div class="flex-main">
          <label for="lotNumber3">เลข LOT 3</label>
          <input type="text" id="lotNumber3" placeholder="พิมพ์/สแกน">
        </div>
        <div class="flex-sub">
          <label for="workingHours3">ชม.</label>
          <input type="number" id="workingHours3" value="0" step="0.5">
        </div>
      </div>
    </div>

    <button type="button" class="btn-add" id="btnAddLot" onclick="addLotField()">+ เพิ่ม LOT ถัดไป</button>

    <div class="form-group">
      <label for="target">ยอดเป้าหมายประจำวัน (TG Target)</label>
      <input type="number" id="target" placeholder="กรอกเป้ารวมทั้งหมด" required>
    </div>

    <div class="btn-group">
      <button type="button" class="btn btn-cancel" onclick="liff.closeWindow()">ยกเลิก</button>
      <button type="submit" class="btn btn-submit">บันทึกข้อมูล</button>
    </div>
  </form>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec";
  let currentLotCount = 1;
  let lineProfile = null;

  async function initLiff() {
    try {
      await liff.init({ liffId: "2011196323-6e8Sc2U8" });
      if (liff.isLoggedIn()) {
        lineProfile = await liff.getProfile();
      } else {
        liff.login();
      }
    } catch (err) { console.error("LIFF Init Error:", err); }
  }
  initLiff();

  function addLotField() {
    if (currentLotCount === 1) {
      document.getElementById('lot2Container').classList.remove('hidden');
      currentLotCount = 2;
    } else if (currentLotCount === 2) {
      document.getElementById('lot3Container').classList.remove('hidden');
      document.getElementById('btnAddLot').classList.add('hidden');
      currentLotCount = 3;
    }
  }

  async function loadLineData() {
    const line = document.getElementById('line').value;
    if (!line) return;

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getTodayLine&line=${encodeURIComponent(line)}`);
      const data = await res.json();

      if (data.reported) {
        document.getElementById('target').value = data.target || '';
        document.getElementById('lotNumber').value = data.lotNumber || '';
        document.getElementById('workingHours').value = data.workingHours || 8;

        if (data.lotNumber2) {
          document.getElementById('lot2Container').classList.remove('hidden');
          document.getElementById('lotNumber2').value = data.lotNumber2;
          document.getElementById('workingHours2').value = data.workingHours2 || 0;
          currentLotCount = 2;
        }

        if (data.lotNumber3) {
          document.getElementById('lot3Container').classList.remove('hidden');
          document.getElementById('lotNumber3').value = data.lotNumber3;
          document.getElementById('workingHours3').value = data.workingHours3 || 0;
          document.getElementById('btnAddLot').classList.add('hidden');
          currentLotCount = 3;
        }
      }
    } catch (err) { console.error("Error loading line data:", err); }
  }

  document.getElementById('tgForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      formType: "TG_FORM",
      line: document.getElementById('line').value,
      target: document.getElementById('target').value,
      lotNumber: document.getElementById('lotNumber').value,
      workingHours: document.getElementById('workingHours').value || 0,
      lotNumber2: document.getElementById('lotNumber2').value || "",
      workingHours2: document.getElementById('workingHours2').value || 0,
      lotNumber3: document.getElementById('lotNumber3').value || "",
      workingHours3: document.getElementById('workingHours3').value || 0,
      updatedBy: lineProfile ? lineProfile.displayName : "Unknown"
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.status === 'success') {
        alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
        liff.closeWindow();
      } else {
        alert("เกิดข้อผิดพลาด: " + (result.error || "ไม่สามารถบันทึกได้"));
      }
    } catch (err) {
      alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
      console.error(err);
    }
  });
</script>

</body>
</html>
