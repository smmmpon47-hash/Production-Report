<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งเป้าการผลิตประจำวัน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
    .hidden-lot { display: none; }
  </style>
</head>
<!-- ดันขึ้นระดับสายตาด้วย pt-8 pb-12 items-start -->
<body class="flex justify-center min-h-screen p-4 pt-8 pb-12 items-start">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 sm:p-7 border border-slate-100 mt-2">
    
    <!-- HEADER (ตัวหนังสือใหญ่ ชัดเจน) -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-2 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-800">ตั้งเป้าการผลิตประจำวัน</h2>
      <p class="text-sm text-slate-400 mt-0.5 font-medium">Daily Production Target</p>
    </div>

    <form id="tgForm" onsubmit="submitData(event)" class="space-y-4">
      
      <!-- LINE SELECT -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">LINE</label>
        <select id="lineSelect" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base text-slate-800 font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="">-- เลือก LINE --</option>
          <option value="B">Line B</option>
          <option value="C">Line C</option>
          <option value="D">Line D</option>
          <option value="E">Line E</option>
          <option value="F">Line F</option>
          <option value="G">Line G</option>
        </select>
      </div>

      <!-- LOT 1 -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-sm font-semibold text-slate-700">เลข LOT</label>
          <label class="text-sm font-semibold text-slate-700 mr-2">ชม.</label>
        </div>
        <div class="flex gap-2">
          <input type="text" id="lotNumber" placeholder="พิมพ์/สแกน" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 uppercase">
          <button type="button" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3.5 py-3 rounded-xl border border-slate-200 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
          </button>
          <input type="number" id="workingHours" value="8" min="1" max="24" class="w-20 bg-slate-50 border border-slate-200 rounded-xl text-center text-base font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
      </div>

      <!-- LOT 2 -->
      <div id="lot2Container" class="hidden-lot pt-1">
        <div class="flex justify-between items-center mb-1.5">
          <div class="flex items-center gap-2">
            <label class="text-sm font-semibold text-slate-700">เลข LOT 2</label>
            <button type="button" onclick="removeLotField(2)" class="text-xs text-red-500 hover:text-red-700 font-semibold">(ลบ)</button>
          </div>
          <label class="text-sm font-semibold text-slate-700 mr-2">ชม.</label>
        </div>
        <div class="flex gap-2">
          <input type="text" id="lotNumber2" placeholder="พิมพ์/สแกน" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 uppercase">
          <button type="button" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3.5 py-3 rounded-xl border border-slate-200 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
          </button>
          <input type="number" id="workingHours2" value="0" min="0" max="24" class="w-20 bg-slate-50 border border-slate-200 rounded-xl text-center text-base font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
      </div>

      <!-- LOT 3 -->
      <div id="lot3Container" class="hidden-lot pt-1">
        <div class="flex justify-between items-center mb-1.5">
          <div class="flex items-center gap-2">
            <label class="text-sm font-semibold text-slate-700">เลข LOT 3</label>
            <button type="button" onclick="removeLotField(3)" class="text-xs text-red-500 hover:text-red-700 font-semibold">(ลบ)</button>
          </div>
          <label class="text-sm font-semibold text-slate-700 mr-2">ชม.</label>
        </div>
        <div class="flex gap-2">
          <input type="text" id="lotNumber3" placeholder="พิมพ์/สแกน" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 uppercase">
          <button type="button" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3.5 py-3 rounded-xl border border-slate-200 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
          </button>
          <input type="number" id="workingHours3" value="0" min="0" max="24" class="w-20 bg-slate-50 border border-slate-200 rounded-xl text-center text-base font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
      </div>

      <!-- ปุ่มกดเพิ่ม LOT -->
      <div id="addLotBtnContainer" class="pt-1">
        <button type="button" onclick="addNextLot()" class="text-sm font-bold text-emerald-600 hover:text-emerald-700 flex items-center gap-1.5 transition py-1">
          <span class="text-base font-extrabold">+</span> เพิ่ม LOT (ถ้ามี)
        </button>
      </div>

      <!-- TG TARGET -->
      <div class="pt-2">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">TG</label>
        <input type="number" id="tgTarget" placeholder="กรอกเป้ารวม" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-lg font-bold text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>

      <!-- BUTTONS -->
      <div class="flex gap-3 pt-4">
        <button type="button" onclick="window.close()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-xl transition text-base">
          CANCEL
        </button>
        <button type="submit" id="submitBtn" class="w-1/2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-200 text-base">
          SAVE
        </button>
      </div>

    </form>
  </div>

  <script>
    // ⚠️ อย่าลืมเปลี่ยนเป็น URL Web App Apps Script ของอาจารย์นะครับ
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec";

    let currentLotCount = 1;

    function addNextLot() {
      if (currentLotCount === 1) {
        document.getElementById('lot2Container').classList.remove('hidden-lot');
        currentLotCount = 2;
      } else if (currentLotCount === 2) {
        document.getElementById('lot3Container').classList.remove('hidden-lot');
        document.getElementById('addLotBtnContainer').classList.add('hidden-lot');
        currentLotCount = 3;
      }
    }

    function removeLotField(lotNum) {
      if (lotNum === 2) {
        if (currentLotCount === 3) {
          document.getElementById('lotNumber2').value = document.getElementById('lotNumber3').value;
          document.getElementById('workingHours2').value = document.getElementById('workingHours3').value;
          clearLotField(3);
          document.getElementById('lot3Container').classList.add('hidden-lot');
          currentLotCount = 2;
        } else {
          clearLotField(2);
          document.getElementById('lot2Container').classList.add('hidden-lot');
          currentLotCount = 1;
        }
      } else if (lotNum === 3) {
        clearLotField(3);
        document.getElementById('lot3Container').classList.add('hidden-lot');
        currentLotCount = 2;
      }
      document.getElementById('addLotBtnContainer').classList.remove('hidden-lot');
    }

    function clearLotField(num) {
      document.getElementById(`lotNumber${num}`).value = '';
      document.getElementById(`workingHours${num}`).value = '0';
    }

    function submitData(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      const payload = {
        line: document.getElementById('lineSelect').value,
        target: document.getElementById('tgTarget').value,
        lotNumber: document.getElementById('lotNumber').value,
        workingHours: document.getElementById('workingHours').value,
        lotNumber2: document.getElementById('lotNumber2').value,
        workingHours2: document.getElementById('workingHours2').value,
        lotNumber3: document.getElementById('lotNumber3').value,
        workingHours3: document.getElementById('workingHours3').value,
        updatedBy: "Form System"
      };

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("บันทึกเป้าสำเร็จเรียบร้อยแล้ว!");
        btn.disabled = false;
        btn.innerText = "SAVE";
        document.getElementById('tgForm').reset();
      })
      .catch(err => {
        alert("เกิดข้อผิดพลาด: " + err.message);
        btn.disabled = false;
        btn.innerText = "SAVE";
      });
    }
  </script>
</body>
</html>
