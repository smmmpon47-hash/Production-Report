<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งเป้าการผลิตประจำวัน</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F1F5F9; color: #0F172A; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-center">

  <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-xl space-y-4 w-full box-border">
    
    <!-- Title Header -->
    <div class="text-center border-b border-slate-100 pb-2">
      <h1 class="text-2xl font-bold text-slate-800">เป้าการผลิตประจำวัน</h1>
    </div>

    <div id="alertBanner" class="hidden p-3 rounded-2xl text-xs bg-amber-50 border border-amber-200 text-amber-800 font-medium"></div>

    <form id="reportForm" onsubmit="handleSubmit(event)" class="space-y-4">
      
      <!-- 1. LINE Select -->
      <div>
        <label class="block text-base font-bold text-slate-700 mb-1">LINE</label>
        <div class="relative">
          <select id="lineCode" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-2xl font-bold text-slate-800 text-lg appearance-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" onchange="fetchLineData()" required>
            <option value="" disabled selected>-- เลือก LINE --</option>
            <option value="B">LINE B</option>
            <option value="C">LINE C</option>
            <option value="D">LINE D</option>
            <option value="E">LINE E</option>
            <option value="F">LINE F</option>
            <option value="G">LINE G</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 text-base">▼</div>
        </div>
      </div>

      <!-- 2. LOT 1 Section -->
      <div class="space-y-1">
        <div class="flex justify-between items-center text-sm font-bold text-slate-700">
          <span>เลข LOT</span>
          <span class="w-14 text-center">ชม.</span>
        </div>
        <div class="flex gap-2 items-center">
          <input type="text" id="lotNumber" class="flex-1 min-w-0 p-3 bg-slate-50 border border-slate-300 rounded-2xl font-bold text-slate-800 text-base uppercase focus:bg-white focus:border-blue-500 outline-none" placeholder="พิมพ์/สแกน" onblur="fetchLotInfo('1')" required>
          
          <!-- ปุ่ม QR แบบไอคอนภาพ -->
          <button type="button" onclick="scanBarcode('lotNumber')" class="w-12 h-12 bg-[#F2F0E9] hover:bg-orange-100 border-2 border-[#1B2A4A] rounded-2xl transition-all active:scale-95 flex items-center justify-center shrink-0 p-1.5 shadow-sm">
            <svg class="w-full h-full text-[#0B1E38]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="#D95D00" stroke-width="2.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
              <path d="M14 14h3v3h-3z" fill="currentColor"/>
              <path d="M18 18h3v3h-3z" fill="currentColor"/>
              <path d="M18 14h3v3" />
            </svg>
          </button>
          
          <input type="number" id="workingHours" step="0.5" min="1" max="24" class="w-14 p-3 bg-slate-50 border border-slate-300 rounded-2xl font-bold text-slate-800 text-base text-center focus:bg-white focus:border-blue-500 outline-none shrink-0" value="8" required>
        </div>
        
        <div id="lotInfo1" class="text-xs font-semibold text-blue-600 px-1 pt-0.5">
          โมเดล: <span id="infoModel1" class="text-slate-800 font-normal">-</span>
        </div>
      </div>

      <!-- 3. LOT 2 Section -->
      <div class="space-y-1 pt-1">
        <div class="flex justify-between items-center text-sm font-bold text-slate-700">
          <span>เลข LOT 2 (ถ้ามี)</span>
          <span class="w-14 text-center">ชม.</span>
        </div>
        <div class="flex gap-2 items-center">
          <input type="text" id="lotNumber2" class="flex-1 min-w-0 p-3 bg-slate-50 border border-slate-300 rounded-2xl font-bold text-slate-800 text-base uppercase focus:bg-white focus:border-blue-500 outline-none" placeholder="พิมพ์/สแกน" onblur="fetchLotInfo('2')">
          
          <!-- ปุ่ม QR แบบไอคอนภาพ -->
          <button type="button" onclick="scanBarcode('lotNumber2')" class="w-12 h-12 bg-[#F2F0E9] hover:bg-orange-100 border-2 border-[#1B2A4A] rounded-2xl transition-all active:scale-95 flex items-center justify-center shrink-0 p-1.5 shadow-sm">
            <svg class="w-full h-full text-[#0B1E38]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="#D95D00" stroke-width="2.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
              <path d="M14 14h3v3h-3z" fill="currentColor"/>
              <path d="M18 18h3v3h-3z" fill="currentColor"/>
              <path d="M18 14h3v3" />
            </svg>
          </button>
          
          <input type="number" id="workingHours2" step="0.5" min="0" max="24" class="w-14 p-3 bg-slate-50 border border-slate-300 rounded-2xl font-bold text-slate-800 text-base text-center focus:bg-white focus:border-blue-500 outline-none shrink-0" value="0">
        </div>
        
        <div id="lotInfo2" class="text-xs font-semibold text-blue-600 px-1 pt-0.5">
          โมเดล: <span id="infoModel2" class="text-slate-800 font-normal">-</span>
        </div>
      </div>

      <!-- 4. TG Section -->
      <div class="pt-1">
        <label class="block text-lg font-bold text-slate-800 mb-1">TG</label>
        <input type="number" id="target" class="w-full p-3.5 bg-slate-50 border border-slate-300 rounded-2xl font-black text-2xl text-emerald-600 focus:bg-white focus:border-emerald-500 outline-none" placeholder="กรอกเป้ารวม" required>
      </div>

      <input type="hidden" id="reportDate">

      <!-- 5. Action Buttons -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button type="button" onclick="liff.closeWindow()" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-lg transition-all active:scale-95">CANCEL</button>
        <button type="submit" id="btnSave" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl text-lg shadow-md transition-all active:scale-95">SAVE</button>
      </div>
    </form>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxUK2_MCCjW8TrCTjNHJj3AxvJQ2-w1tjHX5Cw6guNxallTCyvUKWqTB2dPtvzZtYbD/exec"; 
    const LIFF_ID = "2011196323-6e8Sc2U8";                 

    document.addEventListener("DOMContentLoaded", async () => {
      document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
      try { await liff.init({ liffId: LIFF_ID }); } catch (err) { console.error("LIFF Init Error", err); }
    });

    async function scanBarcode(targetId) {
      if (!liff.isInClient()) {
        alert("กรุณาเปิดบนแอป LINE เพื่อใช้งานระบบสแกน");
        return;
      }
      try {
        const result = await liff.scanCodeV2();
        if (result.value) {
          document.getElementById(targetId).value = result.value.toUpperCase();
          fetchLotInfo(targetId === 'lotNumber' ? '1' : '2');
        }
      } catch (err) { alert("สแกนไม่สำเร็จ: " + err.message); }
    }

    async function fetchLineData() {
      const line = document.getElementById('lineCode').value;
      if (!line) return;

      const res = await fetch(`${GAS_WEB_APP_URL}?action=getTodayLine&line=${line}`);
      const data = await res.json();

      const alertBanner = document.getElementById('alertBanner');
      if (data.reported) {
        alertBanner.classList.remove('hidden');
        alertBanner.innerText = `⚠️ LINE ${line} ลงเป้าไว้แล้ว (${data.target} ชิ้น) อัปเดตล่าสุด ${data.lastUpdate}`;
        document.getElementById('btnSave').innerText = "UPDATE";
      } else {
        alertBanner.classList.add('hidden');
        document.getElementById('btnSave').innerText = "SAVE";
      }

      if (data.target) document.getElementById('target').value = data.target;
      if (data.otHours) document.getElementById('workingHours').value = data.otHours;
      if (data.lotNumber) {
        document.getElementById('lotNumber').value = data.lotNumber;
        fetchLotInfo('1');
      }
      if (data.lotNumber2) {
        document.getElementById('lotNumber2').value = data.lotNumber2;
        document.getElementById('workingHours2').value = data.workingHours2 || 0;
        fetchLotInfo('2');
      }
    }

    async function fetchLotInfo(type) {
      const fieldId = type === '1' ? 'lotNumber' : 'lotNumber2';
      const lot = document.getElementById(fieldId).value.trim();
      if (!lot) return;

      const res = await fetch(`${GAS_WEB_APP_URL}?searchLot=${lot}`);
      const data = await res.json();

      const modelSpan = document.getElementById(type === '1' ? 'infoModel1' : 'infoModel2');
      if (data.error) {
        modelSpan.innerText = 'ไม่พบข้อมูล';
      } else {
        modelSpan.innerText = data.model;
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerText = "บันทึก...";

      let profileName = "Unknown";
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        profileName = profile.displayName;
      }

      const payload = {
        line: document.getElementById('lineCode').value,
        lotNumber: document.getElementById('lotNumber').value,
        target: Number(document.getElementById('target').value),
        workingHours: Number(document.getElementById('workingHours').value),
        lotNumber2: document.getElementById('lotNumber2').value.trim(),
        workingHours2: Number(document.getElementById('workingHours2').value || 0),
        updatedBy: profileName
      };

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.error) {
          alert("เกิดข้อผิดพลาด: " + result.error);
          btn.disabled = false;
          btn.innerText = "SAVE";
          return;
        }
        alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
        liff.closeWindow();
      } catch (err) {
        alert("ส่งไม่สำเร็จ: " + err.message);
        btn.disabled = false;
        btn.innerText = "SAVE";
      }
    }
  </script>
</body>
</html>
