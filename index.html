<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานเป้าประจำวัน</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Prompt', sans-serif; 
      background-color: #F8FAFC; 
      color: #0F172A;
    }
  </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-center">

  <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-xl space-y-5">
    
    <!-- Header -->
    <div class="text-center pb-2 border-b border-slate-100">
      <h1 class="text-xl font-bold text-slate-800 tracking-wide">📋 ตั้งเป้าการผลิตประจำวัน</h1>
      <p class="text-xs text-slate-400 mt-1">กรอกข้อมูลเป้าหมายประจำไลน์การผลิต</p>
    </div>

    <!-- Alert Banner (แสดงเมื่อมีการตั้งเป้าแล้ว) -->
    <div id="alertBanner" class="hidden p-3 rounded-xl text-xs bg-amber-50 border border-amber-200 text-amber-700 font-medium"></div>

    <form id="reportForm" onsubmit="handleSubmit(event)" class="space-y-4">
      
      <!-- 1. LINE Dropdown -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">LINE การผลิต <span class="text-rose-500">*</span></label>
        <div class="relative">
          <select id="lineCode" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 appearance-none focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all outline-none" onchange="fetchLineData()" required>
            <option value="" disabled selected>-- เลือก LINE --</option>
            <option value="B">LINE B</option>
            <option value="C">LINE C</option>
            <option value="D">LINE D</option>
            <option value="E">LINE E</option>
            <option value="F">LINE F</option>
            <option value="G">LINE G</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
            ▼
          </div>
        </div>
      </div>

      <!-- 2. LOT & QR Scan -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">เลข LOT</label>
        <div class="flex gap-2">
          <input type="text" id="lotNumber" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-medium text-slate-800 uppercase focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all outline-none placeholder:text-slate-300 placeholder:normal-case" placeholder="พิมพ์ หรือ สแกน QR" onblur="fetchLotInfo()">
          <button type="button" onclick="scanBarcode()" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-600 px-4 rounded-xl flex items-center justify-center transition-all active:scale-95">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m0 14v1m8-8h-1M5 12H4m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>
          </button>
        </div>
      </div>

      <!-- 3. ข้อมูลป้ายหลังยิง (จะแสดงเมื่อมีข้อมูล) -->
      <div id="lotInfoBox" class="hidden p-4 bg-slate-50 border border-emerald-200/80 rounded-2xl space-y-2 text-xs">
        <div class="flex justify-between items-center border-b border-slate-200/60 pb-1.5">
          <span class="text-slate-400">รุ่น (Model)</span>
          <span id="infoModel" class="font-bold text-slate-800 text-sm">-</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-slate-400">เป้า PO</span>
          <span id="infoPoTarget" class="font-semibold text-emerald-600">-</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-slate-400">ผลิตสะสม</span>
          <span id="infoActual" class="font-semibold text-blue-600">-</span>
        </div>
      </div>

      <!-- 4. TG (เป้าประจำวัน) -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">TG (เป้าประจำวัน) <span class="text-rose-500">*</span></label>
        <input type="number" id="target" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-2xl text-emerald-600 tracking-wide focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all outline-none placeholder:text-slate-300 placeholder:font-normal placeholder:text-base" placeholder="กรอกเป้าหมาย" required>
      </div>

      <!-- 5. วันที่ (Locked) -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1.5">วันที่ (อัตโนมัติ)</label>
        <input type="text" id="reportDate" class="w-full p-3 bg-slate-100 border border-slate-200 rounded-xl text-xs font-medium text-slate-400 cursor-not-allowed" readonly>
      </div>

      <!-- 6. Action Buttons -->
      <div class="grid grid-cols-2 gap-3 pt-3">
        <button type="button" onclick="liff.closeWindow()" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl transition-all active:scale-95">CANCEL</button>
        <button type="submit" id="btnSave" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-xl shadow-lg shadow-emerald-500/25 transition-all active:scale-95">SAVE</button>
      </div>

    </form>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzDaRH4kbo7lElXKBCQUbUn7uvYISayMM51fBT3KTY1q_MHqRis7DEDYRfqoTK7NwQg/exec"; // 🔴 เปลี่ยนเป็น URL ของ Google Apps Script Web App
    const LIFF_ID = "2011196323-6e8Sc2U8";                 // 🔴 เปลี่ยนเป็น LIFF ID ของคุณ

    document.addEventListener("DOMContentLoaded", async () => {
      document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (err) { console.error("LIFF Init Error", err); }
    });

    async function scanBarcode() {
      if (!liff.isInClient()) {
        alert("กรุณาเปิดบนแอป LINE เพื่อใช้งานระบบสแกน");
        return;
      }
      try {
        const result = await liff.scanCodeV2();
        if (result.value) {
          document.getElementById('lotNumber').value = result.value.toUpperCase();
          fetchLotInfo();
        }
      } catch (err) { alert("สแกนไม่สำเร็จ: " + err.message); }
    }

    async function fetchLineData() {
      const line = document.getElementById('lineCode').value;
      if (!line) return;

      const res = await fetch(`${GAS_WEB_APP_URL}?action=getTodayLine&line=${line}`);
      const data = await res.json();

      const alertBanner = document.getElementById('alertBanner');
      if (data.reported) {
        alertBanner.classList.remove('hidden');
        alertBanner.innerText = `⚠️ LINE ${line} เคยลงเป้าไว้แล้ว (${data.target}) อัปเดตล่าสุด ${data.lastUpdate}`;
        document.getElementById('btnSave').innerText = "UPDATE";
      } else {
        alertBanner.classList.add('hidden');
        document.getElementById('btnSave').innerText = "SAVE";
      }

      if (data.target) document.getElementById('target').value = data.target;
      if (data.lotNumber) {
        document.getElementById('lotNumber').value = data.lotNumber;
        fetchLotInfo();
      }
    }

    async function fetchLotInfo() {
      const lot = document.getElementById('lotNumber').value.trim();
      if (!lot) return;

      const res = await fetch(`${GAS_WEB_APP_URL}?searchLot=${lot}`);
      const data = await res.json();

      const box = document.getElementById('lotInfoBox');
      if (data.error) {
        box.classList.add('hidden');
      } else {
        box.classList.remove('hidden');
        document.getElementById('infoModel').innerText = data.model;
        document.getElementById('infoPoTarget').innerText = Number(data.po_target).toLocaleString();
        document.getElementById('infoActual').innerText = Number(data.cumulative_actual).toLocaleString();
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerText = "บันทึก...";

      let profileName = "Unknown";
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        profileName = profile.displayName;
      }

      const payload = {
        line: document.getElementById('lineCode').value,
        lotNumber: document.getElementById('lotNumber').value,
        target: Number(document.getElementById('target').value),
        actual: 0,
        updatedBy: profileName
      };

      await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      alert("ตั้งเป้าหมายสำเร็จ!");
      liff.closeWindow();
    }
  </script>
</body>
</html>
